<!doctype html><meta charset="utf-8"><title>Contrôle du personnage</title>
<style>body{margin:0;background:#1c1c1c;color:#ddd;font:14px Inter,sans-serif}.l{display:flex;gap:24px;padding:12px 16px;align-items:flex-end}.l img,.l canvas{height:var(--h);width:auto}</style>
<body>
<script>
// Même calcul que le widget Flutter : base, puis pour chaque muscle la base teintée
// (matrice : couleur x gain x luminance) à travers le masque, puis les coutures par-dessus.
const ROUGE = [0xE0 / 255, 0x39 / 255, 0x3E / 255], GAIN = 1 / 0.86;
const charge = (u) => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = u; });
function pixels(img, w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.drawImage(img, 0, 0, w, h); return g.getImageData(0, 0, w, h); }
async function compose(dossier, pre, muscles) {
  const base = await charge(`${dossier}/${pre}_base.png`);
  const traits = await charge(`${dossier}/${pre}_traits.png`);
  const w = base.naturalWidth, h = base.naturalHeight;
  const b = pixels(base, w, h), out = new ImageData(new Uint8ClampedArray(b.data), w, h);
  for (const [m, t] of Object.entries(muscles)) {
    const mi = await charge(`${dossier}/masques/${pre}_${m}.png`);
    if (!mi) continue;
    const mk = pixels(mi, w, h).data;
    for (let i = 0; i < w * h; i++) {
      const a = mk[i * 4 + 3] / 255 * t;
      if (!a) continue;
      const L = b.data[i * 4] / 255;
      for (let k = 0; k < 3; k++) {
        const v = Math.min(1, ROUGE[k] * GAIN * L) * 255;
        out.data[i * 4 + k] = out.data[i * 4 + k] * (1 - a) + v * a;
      }
    }
  }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.putImageData(out, 0, 0);
  if (traits) g.drawImage(traits, 0, 0);
  return c;
}
window.ligne = async (hauteur, elements) => {
  const d = document.createElement('div'); d.className = 'l'; d.style.setProperty('--h', hauteur + 'px');
  for (const e of elements) {
    if (typeof e === 'string') { const i = await charge(e); d.appendChild(i); }
    else d.appendChild(await compose(e.dossier, e.pre, e.muscles));
  }
  document.body.appendChild(d);
};
window.pret = true;
</script>
