<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÆSTHETIC, proposition de design</title>
<style>
  @font-face { font-family: Figtree; font-weight: 400; src: url(../../assets/fonts/Figtree-Regular.ttf); }
  @font-face { font-family: Figtree; font-weight: 500; src: url(../../assets/fonts/Figtree-Medium.ttf); }
  @font-face { font-family: Figtree; font-weight: 600; src: url(../../assets/fonts/Figtree-SemiBold.ttf); }
  @font-face { font-family: Figtree; font-weight: 700; src: url(../../assets/fonts/Figtree-Bold.ttf); }
  @font-face { font-family: Figtree; font-weight: 800; src: url(../../assets/fonts/Figtree-ExtraBold.ttf); }
  :root {
    --fond: #000; --carte: #131315; --carte2: #1D1D20; --filet: #222226;
    --texte: #fff; --gris: #8E8E93; --gris2: #5C5C61;
    --accent: #FF5A5F; --vert: #22D85F; --vert-fond: #12261A;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #0B0B0C; color: var(--texte); font-family: Figtree, system-ui, sans-serif; padding: 32px 24px 64px; }
  h1 { font-size: 22px; font-weight: 800; }
  .intro { color: var(--gris); margin: 6px 0 28px; max-width: 760px; line-height: 1.5; font-size: 15px; }
  .planche { display: flex; flex-wrap: wrap; gap: 28px; }
  figure { width: 390px; }
  figcaption { color: var(--gris); font-size: 13px; margin: 0 4px 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .tel { width: 390px; height: 844px; background: var(--fond); border-radius: 44px; border: 1px solid #2A2A2E; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .ecran { flex: 1; padding: 58px 20px 0; overflow: hidden; }
  .nav { height: 78px; border-top: 1px solid var(--filet); display: flex; padding-bottom: 14px; }
  .nav div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--gris2); font-size: 11px; font-weight: 600; }
  .nav div.actif { color: var(--texte); }
  .nav svg { width: 23px; height: 23px; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .sur { color: var(--gris); font-size: 14px; font-weight: 500; }
  .titre { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .tete { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--carte2); display: grid; place-items: center; font-weight: 700; }
  .etiquette { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gris); }
  .section { display: flex; justify-content: space-between; align-items: baseline; margin: 28px 0 14px; }
  .section b { font-size: 18px; font-weight: 700; }
  .section span { color: var(--gris); font-size: 14px; font-weight: 500; }
  .carte { background: var(--carte); border-radius: 24px; padding: 20px; }
  .bouton { height: 54px; border-radius: 27px; background: var(--accent); color: #fff; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .bouton.gris { background: var(--carte2); }
  .bouton.petit { height: 36px; padding: 0 16px; font-size: 14px; border-radius: 18px; }

  /* Corps : base grise et calques de muscles, tous sur la même toile. */
  .corps { position: relative; aspect-ratio: 636 / 1500; }
  .corps.carre { aspect-ratio: 1; }
  .corps img { position: absolute; inset: 0; width: 100%; height: 100%; }

  .heros { display: flex; justify-content: space-between; gap: 12px; }
  .heros .nom { font-size: 36px; font-weight: 800; letter-spacing: -.02em; margin: 8px 0 4px; }
  .heros .duo { display: flex; gap: 4px; }
  .heros .corps { height: 150px; }

  .semaine { display: flex; justify-content: space-between; }
  .jour { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--gris2); }
  .jour i { width: 38px; height: 38px; border-radius: 50%; background: var(--carte); display: grid; place-items: center; font-style: normal; color: var(--gris); font-size: 14px; }
  .jour.fait i { background: var(--accent); color: #fff; }
  .jour.auj i { background: none; border: 2px solid var(--accent); color: #fff; }
  .jour.auj { color: #fff; }

  .tuiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tuiles .carte { padding: 18px; }
  .chiffre { font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin-top: 6px; }
  .chiffre small { font-size: 15px; font-weight: 600; color: var(--gris); }

  .ligne { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--filet); }
  .ligne:first-child { border-top: 0; }
  .ligne .t { flex: 1; min-width: 0; }
  .ligne .t b { display: block; font-size: 17px; font-weight: 700; }
  .ligne .t span { color: var(--gris); font-size: 14px; }
  .vignette { width: 52px; height: 52px; border-radius: 14px; background: var(--carte2); flex: none; padding: 4px; }
  .vignette img { width: 100%; height: 100%; object-fit: contain; }
  .rond { width: 40px; height: 40px; border-radius: 50%; background: var(--carte2); display: grid; place-items: center; color: #fff; flex: none; }
  .rond svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
  .chevron { color: var(--gris2); width: 18px; height: 18px; flex: none; }

  .onglets { display: flex; gap: 24px; border-bottom: 1px solid var(--filet); margin-bottom: 22px; }
  .onglets span { padding-bottom: 12px; font-size: 16px; font-weight: 600; color: var(--gris); }
  .onglets span.actif { color: #fff; box-shadow: 0 2px 0 var(--accent); }
  .barre { height: 6px; border-radius: 3px; background: var(--carte2); overflow: hidden; margin-top: 14px; }
  .barre i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

  .silhouettes { display: flex; gap: 10px; margin-bottom: 22px; }
  .silhouettes .corps { width: 62px; border-radius: 16px; background: var(--carte); flex: none; }
  .silhouettes .corps.choisi { outline: 2px solid #fff; }
  .grille { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .exo { background: var(--carte); border-radius: 20px; padding: 12px 12px 14px; }
  .exo img { width: 100%; aspect-ratio: 1; object-fit: contain; }
  .exo b { display: block; font-size: 15px; font-weight: 700; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exo span { color: var(--gris); font-size: 13px; }

  .seance-tete { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .seance-tete .t { flex: 1; }
  .seance-tete b { font-size: 20px; font-weight: 800; display: block; }
  .seance-tete span { color: var(--accent); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .seance-tete span em { color: var(--gris); font-style: normal; font-weight: 500; }
  .entete, .serie { display: grid; grid-template-columns: 34px 1fr 64px 56px 44px; align-items: center; gap: 8px; text-align: center; }
  .entete { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--gris2); margin: 18px 0 6px; padding: 0 8px; }
  .serie { height: 52px; border-radius: 14px; padding: 0 8px; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .serie .avant { color: var(--gris2); font-weight: 500; font-size: 15px; }
  .serie .champ { background: var(--carte2); border-radius: 10px; height: 38px; display: grid; place-items: center; color: var(--gris); }
  .serie .coche { width: 40px; height: 38px; border-radius: 12px; background: var(--carte2); display: grid; place-items: center; color: var(--gris2); justify-self: end; }
  .serie .coche svg { width: 18px; height: 18px; stroke-width: 3; }
  .serie.faite { background: var(--vert-fond); }
  .serie.faite .champ { background: none; color: #fff; }
  .serie.faite .coche { background: var(--vert); color: #000; }
  .ajout { height: 46px; border-radius: 23px; background: var(--carte); color: #fff; font-weight: 700; font-size: 15px; display: grid; place-items: center; margin: 10px 0 18px; }

  .periodes { display: flex; gap: 8px; margin-bottom: 26px; }
  .periodes span { padding: 8px 14px; border-radius: 18px; background: var(--carte); color: var(--gris); font-size: 14px; font-weight: 600; }
  .periodes span.actif { background: #fff; color: #000; }
  .grand { font-size: 44px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
  .grand small { font-size: 22px; color: var(--gris); font-weight: 700; }
  .hausse { color: var(--vert); font-weight: 700; font-size: 14px; }
  .graphe { display: flex; align-items: flex-end; gap: 8px; height: 104px; margin-top: 18px; }
  .graphe i { flex: 1; background: var(--accent); opacity: .35; border-radius: 6px 6px 2px 2px; }
  .graphe i:last-child { opacity: 1; }
  .muscle { display: grid; grid-template-columns: 104px 1fr 72px; gap: 12px; align-items: center; font-size: 15px; font-weight: 600; padding: 7px 0; }
  .muscle .barre { margin: 0; }
  .muscle em { white-space: nowrap; font-style: normal; color: var(--gris); font-size: 14px; text-align: right; font-weight: 500; }
  .duo-centre { display: flex; justify-content: center; gap: 18px; }
  .duo-centre .corps { height: 150px; }
</style>
</head>
<body>
<h1>ÆSTHETIC, proposition de design</h1>
<p class="intro">Une seule idée par écran, beaucoup d'air, une seule couleur d'accent. Fond noir, cartes très discrètes, la police Figtree en gras pour les titres et les chiffres. Le vert ne sert qu'aux séries validées. Tout ce qui n'aide pas à s'entraîner sort de l'écran.</p>
