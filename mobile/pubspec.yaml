name: aesthetic
description: "ÆSTHETIC, musculation, nutrition, sommeil et coach"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.4

# Seul l'agent fondation modifie ce fichier : les modules demandent dans COORDINATION.md.
dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  go_router: ^18.0.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1
  fl_chart: ^1.2.0
  flutter_svg: ^2.3.0
  path_drawing: ^1.0.1
  cached_network_image: ^4.0.3
  file_picker: ^13.1.0
  csv: ^8.0.0
  share_plus: ^13.3.0
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.2
  http: ^1.6.0
  health: ^13.3.2
  flutter_local_notifications: ^22.3.1
  wakelock_plus: ^1.8.0
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1
  flutter_markdown_plus: ^1.0.12
  path: ^1.9.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  video_player: ^2.14.0
  archive: ^4.3.0
  vibration: ^3.2.1
  audioplayers: ^6.8.1
  flutter_localizations:
    sdk: flutter
  home_widget: ^0.10.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/body/pack/
    - assets/exercises/anim/
    - assets/exercises/poses/
    - assets/exercises/materiel/
    - assets/images/
    # Objets 3D du bilan et des cartes de fin de séance (licence MIT, voir docs/SOURCES_OBJETS.md).
    - assets/objets/
    - assets/sons/
    - assets/sons/decompte/
  fonts:
    # Figtree : la police de l'appli, embarquée (400 à 800).
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
    # Montserrat : gros titres du bilan seulement (600 à 900).
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900

# Icône de lancement : dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: tool/icone/icone.png
  adaptive_icon_background: "#050505"
  adaptive_icon_foreground: tool/icone/avant_plan.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 26
