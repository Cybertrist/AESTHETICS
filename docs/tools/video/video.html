<!doctype html>
<!-- La vidéo de présentation, image par image. Chaque scène a son fichier
     dans scenes/ et s'enregistre par scene({...}) ; rendre(t) pose toute la
     page à l'instant t, sans horloge. capture.js appelle rendre() trente
     fois par seconde et photographie la page. La musique fait 150
     battements par minute : un temps dure 0,4 s, la vidéo en compte 64. -->
<html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000;color:#fff;font-family:'Space Grotesk',sans-serif}
/* une scène : un calque plein cadre, que rendre() montre ou cache */
.s{position:absolute;inset:0;opacity:0;overflow:hidden}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fond{position:absolute;inset:0;background:radial-gradient(60% 80% at 50% 45%,#1c1c20 0,#000 70%)}
.titre{font-family:Syne,sans-serif;font-weight:800;letter-spacing:1px;line-height:1.02;text-transform:uppercase}
.texte{font-size:27px;color:#a8a8b0;line-height:1.4}
.mono{font-family:'JetBrains Mono',monospace}
/* le téléphone : une capture brute de 1080 px, ses barres masquées par le cadre.
   --l est la largeur de l'écran ; tout le reste en découle. */
.tel{--l:290px;position:absolute;padding:calc(var(--l)*.031);border-radius:calc(var(--l)*.158);
  background:linear-gradient(160deg,#3a3b41,#0e0f12 45%,#26272c);
  box-shadow:0 0 0 1px #4a4a52,0 50px 90px -20px rgba(0,0,0,.9),0 0 90px -10px rgba(255,255,255,.18)}
.tel .v{position:relative;width:var(--l);height:calc(var(--l)*2.038);border-radius:calc(var(--l)*.131);overflow:hidden;background:#000}
.tel img{position:absolute;left:0;top:calc(var(--l)*-.1259);width:var(--l)}
#eclair{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
<style id="styles-scenes"></style>
</head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <!-- reteindre un calque de muscle : sa clarté devient la couleur, son modelé reste -->
  <filter id="orange" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.45 1.50 0.15 0 0  0.30 1.00 0.10 0 0  0.07 0.24 0.02 0 0  0 0 0 1 0"/></filter>
  <filter id="vert" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.06 0.20 0.02 0 0  0.38 1.27 0.13 0 0  0.17 0.56 0.06 0 0  0 0 0 1 0"/></filter>
  <filter id="rouge" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.41 1.38 0.14 0 0  0.10 0.35 0.04 0 0  0.11 0.38 0.04 0 0  0 0 0 1 0"/></filter>
</defs></svg>
<div id="scenes"></div>
<div id="eclair"></div>

<script>
// ------------------------------------------------------------ les outils
const T = 0.4; // un temps, en secondes
const borne = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * borne(k);
const sortie = (x) => 1 - Math.pow(1 - borne(x), 3);                    // ralentit à l'arrivée
const entree = (x) => Math.pow(borne(x), 3);                            // accélère au départ
const rebond = (x) => { x = borne(x); return 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2); }; // dépasse puis revient
const pouls = (b, force = 0.035) => 1 + force * Math.exp(-((((b % 1) + 1) % 1) * 5)); // un battement sur chaque temps
const $ = (id) => document.getElementById(id);
const BRUT = '../src-captures/brut/', EXO = '../../exercices/', CORPS = '../../exercices/corps/', LOGO = '../../logo.png';
/// Un téléphone qui montre une capture : tel('05-seance', 'left:210px;top:55px', 290).
const tel = (capture, style = '', largeur = 290, id = '') =>
  `<div class="tel" ${id ? `id="${id}"` : ''} style="--l:${largeur}px;${style}"><div class="v"><img src="${BRUT}${capture}.png"></div></div>`;
/// Les animations d'exercices, décodées image par image : await animation('bench-press'), puis
/// dessiner(canvas, 'bench-press', t) à chaque rendu (20 images par seconde, en boucle).
const IMAGES = {};
async function animation(nom) {
  if (IMAGES[nom]) return IMAGES[nom];
  const r = await fetch(`${EXO}${nom}.webp`);
  const d = new ImageDecoder({ data: await r.arrayBuffer(), type: 'image/webp' });
  await d.tracks.ready; await d.completed;
  const n = d.tracks.selectedTrack.frameCount, images = [];
  for (let k = 0; k < n; k++) { const { image } = await d.decode({ frameIndex: k }); images.push(await createImageBitmap(image)); image.close(); }
  return (IMAGES[nom] = images);
}
function dessiner(canvas, nom, t) {
  const images = IMAGES[nom]; if (!images) return;
  const x = canvas.getContext('2d');
  x.clearRect(0, 0, canvas.width, canvas.height);
  x.drawImage(images[Math.floor(t * 20) % images.length], 0, 0, canvas.width, canvas.height);
}

// ------------------------------------------------------------ les scènes
// scene({ id, de, a, html, css, init, rendre }) : [de] et [a] en temps (0 à 64).
// rendre(l, b, t) reçoit le temps local à la scène (l = b - de), le temps global b, et t en secondes.
const SCENES = [];
function scene(s) {
  SCENES.push(s);
  if (s.css) $('styles-scenes').textContent += s.css;
  $('scenes').insertAdjacentHTML('beforeend', `<div class="s" id="s-${s.id}">${s.html}</div>`);
}
// Les coupes franches, soulignées d'un éclair blanc : l'entrée, le plein, la fin.
const ECLAIRS = [0, 16, 56];
function rendre(t) {
  const b = t / T;
  for (const s of SCENES) {
    const fin = s.a >= 64 ? 1 : borne((s.a - b) / 0.2);
    const o = borne((b - s.de) / 0.2) * fin;
    $(`s-${s.id}`).style.opacity = o;
    if (o > 0) s.rendre(b - s.de, b, t);
  }
  $('eclair').style.opacity = Math.max(...ECLAIRS.map((c) => (b >= c ? Math.max(0, 0.7 - (b - c) * 1.6) : 0)));
}
</script>
<script src="scenes/01-ouverture.js"></script>
<script src="scenes/02-phrases.js"></script>
<script src="scenes/03-seance.js"></script>
<script src="scenes/04-repos.js"></script>
<script src="scenes/05-record.js"></script>
<script src="scenes/06-exercices.js"></script>
<script src="scenes/07-recuperation.js"></script>
<script src="scenes/08-resume.js"></script>
<script src="scenes/09-badges.js"></script>
<script src="scenes/10-fin.js"></script>
<script>
// Prête quand les polices, les images et les préparatifs de chaque scène sont là.
(async () => {
  await document.fonts.ready;
  await Promise.all(SCENES.map((s) => (s.init ? s.init().catch((e) => console.error(s.id, e)) : null)));
  await Promise.all([...document.images].map((i) => (i.complete ? null : new Promise((ok) => { i.onload = i.onerror = ok; }))));
  rendre(0);
  window.pret = true;
})();
</script>
</body></html>
