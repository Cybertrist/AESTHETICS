<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AESTHETICS</title>
<meta name="theme-color" content="#0B0B0C">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0B0B0C; color: #F2F2F4; padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  .nom { font-weight: 800; letter-spacing: 4px; font-size: 14px; color: #9A9AA2; }
  h1 { font-size: 28px; margin: 28px 0 8px; }
  .pseudo { color: #FF6A2B; font-weight: 700; word-break: break-all; }
  p { color: #B4B4BC; line-height: 1.5; margin: 0 0 28px; }
  a.bouton {
    display: block; padding: 18px; border-radius: 34px; background: #FFFFFF; color: #0B0B0C;
    text-decoration: none; font-weight: 700; font-size: 17px;
  }
  .note { font-size: 13px; color: #74747C; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <div class="nom">AESTHETICS</div>
  <h1>Ajoute <span class="pseudo" id="pseudo">un ami</span></h1>
  <p>Ouvre ce lien sur un téléphone où AESTHETICS est installée : la demande d'ami part toute seule.</p>
  <a class="bouton" id="ouvrir" href="#">Ouvrir dans AESTHETICS</a>
  <div class="note">Rien ne s'ouvre ? L'appli n'est pas encore installée sur ce téléphone.</div>
</main>
<script>
  // /ami/<pseudo> : le pseudo, puis un lien qui force l'ouverture de l'appli
  // quand le navigateur n'a pas laissé Android le faire tout seul.
  var pseudo = decodeURIComponent(location.pathname.replace(/^\/ami\/?/, '').split('/')[0] || '').trim();
  if (pseudo) document.getElementById('pseudo').textContent = '@' + pseudo;
  document.getElementById('ouvrir').href = 'intent://aesthetics-cybertrist.web.app/ami/' + encodeURIComponent(pseudo)
    + '#Intent;scheme=https;package=fr.cybertrist.aesthetic;end';
</script>
</body>
</html>
